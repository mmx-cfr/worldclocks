<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  :root {
    --font: "Season Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --bg: #0b0806;
    --face: #0b0806;
    --tick: #f2f2f4;
    --tick-dim: #b9b9c0;
    --numeral: #ffffff;
    --hand: #f6f6f8;
    --second: #ff2a2a;
    --label: #f2f2f4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: var(--font);
  }

  /* Square stage that scales to the smaller side of the window */
  .stage {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4cqw;
  }

  .stage svg {
    display: block;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    height: 100%;
  }

  .label {
    margin-top: 2cqw;
    font-size: 5cqw;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--label);
    white-space: nowrap;
  }
  .label:empty { display: none; }

  .numeral {
    fill: var(--numeral);
    font-weight: 700;
    font-size: 19px;
    text-anchor: middle;
    dominant-baseline: central;
    font-family: var(--font);
  }

  .tick-minute { stroke: var(--tick-dim); stroke-width: 2; stroke-linecap: butt; }
  .tick-hour   { stroke: var(--tick);     stroke-width: 4.5; stroke-linecap: butt; }

  .hand-hour, .hand-minute { stroke: var(--hand); stroke-linecap: round; }
  .hand-hour   { stroke-width: 7; }
  .hand-minute { stroke-width: 5.5; }

  .hand-second { stroke: var(--second); stroke-width: 1.8; stroke-linecap: round; }
  .hub { fill: var(--second); }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Analog clock"></main>

<script>
  // ---- URL controls ------------------------------------------------------
  //  ?background=white | black | gold | blue | any hex (# optional)
  //  ?time=1:30         start time (default 1:30). Accepts 13:30, 1:30pm, 1:30:15
  //  ?live=true         ignore the start time and show the real local time
  //  ?label=Washington  optional text under the clock
  //  ?smooth=false      ticking second hand instead of a sweep
  const params = new URLSearchParams(window.location.search);

  (function applyTheme() {
    const raw = (params.get("background") || params.get("bg") || "").trim().toLowerCase();
    if (!raw) return;

    const named = {
      white: "#ffffff", light: "#ffffff",
      black: "#000000", dark: "#000000",
      gold:  "#967636",
      blue:  "#0f2c67"
    };
    let hex = named[raw];
    if (!hex) {
      const m = raw.replace(/^#/, "");
      if (/^[0-9a-f]{3}$/.test(m)) hex = "#" + m.split("").map(c => c + c).join("");
      else if (/^[0-9a-f]{6}$/.test(m)) hex = "#" + m;
    }
    if (!hex) return;

    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const isLight = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;

    const root = document.documentElement.style;
    root.setProperty("--bg", hex);
    root.setProperty("--face", hex);
    if (isLight) {
      root.setProperty("--tick", "#000000");
      root.setProperty("--tick-dim", "#4a4a4a");
      root.setProperty("--numeral", "#000000");
      root.setProperty("--hand", "#000000");
      root.setProperty("--label", "#000000");
    } else {
      root.setProperty("--tick", "#f2f2f4");
      root.setProperty("--tick-dim", "#b9b9c0");
      root.setProperty("--numeral", "#ffffff");
      root.setProperty("--hand", "#f6f6f8");
      root.setProperty("--label", "#f2f2f4");
    }
  })();

  // ---- Start time --------------------------------------------------------
  function parseTime(str) {
    const m = /^(\d{1,2})(?::(\d{2}))?(?::(\d{2}))?\s*(am|pm)?$/i.exec((str || "").trim());
    if (!m) return null;
    let h = +m[1], min = +(m[2] || 0), sec = +(m[3] || 0);
    const ap = (m[4] || "").toLowerCase();
    if (ap === "pm" && h < 12) h += 12;
    if (ap === "am" && h === 12) h = 0;
    if (h > 23 || min > 59 || sec > 59) return null;
    return h * 3600 + min * 60 + sec;
  }

  const DEFAULT_START = 13 * 3600 + 30 * 60;   // 1:30 PM
  const live = (params.get("live") || "").toLowerCase() === "true";
  const smooth = (params.get("smooth") || "").toLowerCase() !== "false";
  const startSeconds = parseTime(params.get("time")) ?? DEFAULT_START;

  function currentSeconds() {
    if (live) {
      const d = new Date();
      return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
    }
    return startSeconds + (performance.now() - t0) / 1000;
  }

  // ---- Build the clock ---------------------------------------------------
  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");

  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function polar(r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return [100 + r * Math.cos(rad), 100 + r * Math.sin(rad)];
  }

  const svg = el("svg", { viewBox: "0 0 200 200", role: "img", "aria-label": "Analog clock" }, stage);
  el("circle", { cx: 100, cy: 100, r: 99, fill: "var(--face)" }, svg);

  for (let i = 0; i < 60; i++) {
    const isHour = i % 5 === 0;
    const [x1, y1] = polar(isHour ? 80 : 88, i * 6);
    const [x2, y2] = polar(95, i * 6);
    el("line", { x1, y1, x2, y2, class: isHour ? "tick-hour" : "tick-minute" }, svg);
  }

  for (let n = 1; n <= 12; n++) {
    const [x, y] = polar(66, n * 30);
    el("text", { x, y, class: "numeral" }, svg).textContent = n;
  }

  const hour   = el("line", { x1: 100, y1: 108, x2: 100, y2: 56, class: "hand-hour" }, svg);
  const minute = el("line", { x1: 100, y1: 110, x2: 100, y2: 30, class: "hand-minute" }, svg);
  const second = el("g", {}, svg);
  el("line", { x1: 100, y1: 122, x2: 100, y2: 22, class: "hand-second" }, second);
  el("circle", { cx: 100, cy: 100, r: 4, class: "hub" }, svg);

  const labelText = (params.get("label") || "").trim();
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = labelText;
  stage.appendChild(label);

  // ---- Run ---------------------------------------------------------------
  const t0 = performance.now();

  function tick() {
    let total = currentSeconds();
    if (!smooth) total = Math.floor(total);

    const sec = total % 60;
    const min = (total / 60) % 60;
    const hr  = (total / 3600) % 12;

    hour.setAttribute("transform",   "rotate(" + (hr * 30)  + " 100 100)");
    minute.setAttribute("transform", "rotate(" + (min * 6)  + " 100 100)");
    second.setAttribute("transform", "rotate(" + (sec * 6)  + " 100 100)");
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>
</body>
</html>
